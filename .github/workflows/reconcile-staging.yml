name: Reconcile staging publications

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Scan only, or execute reviewed repairs
        type: choice
        options: [dry-run, execute]
        default: dry-run
        required: true

permissions:
  contents: read

concurrency:
  group: reconcile-staging
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Dry-run scan
        if: github.event_name == 'schedule' || inputs.mode != 'execute'
        run: node scripts/repair-publications.mjs --audit-id "staging-${GITHUB_RUN_ID}" > reconcile-report.json
        env:
          OPEN_ARTIFACTS_URL: ${{ vars.OPEN_ARTIFACTS_URL }}
          OPEN_ARTIFACTS_REPAIR_TOKEN: ${{ secrets.OPEN_ARTIFACTS_REPAIR_TOKEN }}
      - name: Execute approved repair
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'execute'
        run: node scripts/repair-publications.mjs --execute --audit-id "staging-${GITHUB_RUN_ID}" --confirm "staging-${GITHUB_RUN_ID}" > reconcile-report.json
        env:
          OPEN_ARTIFACTS_URL: ${{ vars.OPEN_ARTIFACTS_URL }}
          OPEN_ARTIFACTS_REPAIR_TOKEN: ${{ secrets.OPEN_ARTIFACTS_REPAIR_TOKEN }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconcile-staging-${{ github.run_id }}
          path: reconcile-report.json
          if-no-files-found: error
          retention-days: 30
